<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Fake News Detector</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  body {
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
  }
  .card-custom {
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    margin-bottom: 30px;
    padding: 20px;
  }
  .section-title {
    font-weight: 700;
    color: #343a40;
    margin-bottom: 20px;
    text-align: center;
  }
  .wordcloud-img {
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
  }
  .prediction {
    font-size: 1.5rem;
    font-weight: 600;
    padding: 15px;
    border-radius: 15px;
  }
  .alert-fake { background-color: #f8d7da; color: #842029; }
  .alert-real { background-color: #d1e7dd; color: #0f5132; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
  <a class="navbar-brand" href="/"><i class="fas fa-newspaper"></i> Fake News Detector</a>
</nav>

<div class="container mt-5">
  <div class="card card-custom bg-white">
    <h2 class="section-title">Check if News is Real or Fake</h2>
    <form method="POST">
      <div class="mb-3">
        <input type="text" name="news_title" class="form-control form-control-lg" placeholder="News Title" value="{{ title_input }}">
      </div>
      <div class="mb-3">
        <textarea name="news_text" class="form-control" rows="5" placeholder="News Content">{{ text_input }}</textarea>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-gradient btn-lg text-white" style="background: linear-gradient(90deg, #ff758c, #ff7eb3);">
          <i class="fas fa-search"></i> Predict
        </button>
      </div>
    </form>
    {% if prediction %}
      <div class="text-center mt-4">
        <div class="prediction {{ 'alert-fake' if 'Fake' in prediction else 'alert-real' }}">{{ prediction }}</div>
      </div>
    {% endif %}
  </div>

  <div class="card card-custom bg-white mt-5">
    <h2 class="section-title">Dataset Insights</h2>
    <div class="row text-center">
      <div class="col-md-6 mb-4">
        <h5>Label Distribution</h5>
        <img src="data:image/png;base64,{{ label_chart }}" class="img-fluid wordcloud-img">
      </div>
      <div class="col-md-6 mb-4">
        <h5>Fake News WordCloud</h5>
        <img src="data:image/png;base64,{{ fake_wc }}" class="img-fluid wordcloud-img">
      </div>
      <div class="col-md-6 mb-4">
        <h5>Real News WordCloud</h5>
        <img src="data:image/png;base64,{{ real_wc }}" class="img-fluid wordcloud-img">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
